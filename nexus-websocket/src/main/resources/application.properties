spring.application.name=nexus-websocket

# HTTP 端口：承载 REST 推送接口（POST /ws/push）、管理界面（/admin）、推送测试页（/console）与 REST 运维接口
server.port=8089

# 会话 Cookie 名：每个服务必须各不相同，否则同一浏览器无法同时登录多个服务。
# 浏览器只按 host 隔离 Cookie、不认端口，WebSocket(8089) 与 SSE(8088) 同跑在 localhost 时，
# 若都用容器默认的 JSESSIONID，后登录的服务会覆盖前一个写下的 Cookie，
# 表现为「任意一个登录就把另一个踢下线」。各自用独立名字后两者可并存、互不影响
server.servlet.session.cookie.name=NEXUS_WS_SESSIONID

# 改页面即时生效
spring.thymeleaf.cache=false

# ==================================================================================
# 端口规划（同一进程三组端口，共享同一张终端连接注册表）
#   server.port：HTTP，业务系统调用 POST /ws/push 推消息，管理员访问页面
#   ws-port     ：Netty WebSocket，浏览器 / 移动端建长连接，只负责「接收」推送
#   tcp-port    ：Netty TCP，业务系统建长连接，把待推消息交进来（长连接版推送通道）
# ==================================================================================
nexus.ws.ws-port=9090
nexus.ws.ws-path=/ws
# TCP 服务端口（业务系统建连）。除端口外，TCP 通道不单独配置任何参数：
# 心跳节奏 / 单帧上限 / 连接上限 / Netty 线程数全部沿用下面的 WebSocket 配置
nexus.ws.tcp-port=9091

# ----------------------------------------------------------------------------------
# WebSocket 心跳（服务端 -> 客户端 PING，客户端回 PONG）
# ----------------------------------------------------------------------------------
# 写空闲 interval 秒未下发数据则发一次应用级 PING（浏览器拿不到协议层 ping/pong 帧，只能用业务帧）
nexus.ws.heartbeat-interval=15s
# 读空闲 timeout 秒未收到任何上行数据则判定失联并关闭连接（应 >= 3 倍心跳间隔）
nexus.ws.heartbeat-timeout=90s

# 最大 WebSocket 连接数，0 表示不限制
nexus.ws.max-connections=30000
# 单个 WebSocket 帧最大长度（字节）
nexus.ws.max-frame-length=65536

# 台账 IP 归属地（城市）：离线库 ip2region 的数据文件，支持 classpath: / file: 前缀。
# 数据文件需自备（11MB 二进制，不入仓库）：放到 nexus-websocket/src/main/resources/ip2region.xdb，
# 或改这里指向绝对路径。文件缺失只影响城市列（显示 -），其余功能不受影响；
# 客户端全是内网地址时本就用不到——私有地址直接判为「局域网」，不查库
nexus.ws.ip2region-path=classpath:ip2region.xdb

# Netty 线程数：0 = 取 Netty 默认值（CPU 核数 * 2）
nexus.ws.boss-threads=1
nexus.ws.worker-threads=0

# ----------------------------------------------------------------------------------
# 鉴权：两条独立的链
# ----------------------------------------------------------------------------------
# 推送鉴权：X-Ws-AppId + X-Ws-Key，决定「谁能推」
# 应用不在配置文件中：内置默认应用 test-demo / c3RyZWFtLW5leHVz（白名单 test），
# 该默认应用只读（不可改、不可删），要别的凭证请在管理页新建
# 其余应用在 /admin 管理页「推送应用」页签运行时增删，并落盘到下面的文件（重启后仍在）
# 相对路径以模块根目录（nexus-websocket）为基准，不受启动工作目录影响；多实例部署请各自指向独立文件
nexus.ws.auth-enabled=true
nexus.ws.app-store-path=data/push-apps.json
# 建连鉴权：false = 关闭（默认），任何客户端都能直连 ws://host:9090/ws；
# 开启后必须携带下面的令牌（查询参数 token，WebSocket 握手无法自定义请求头）
nexus.ws.connect-auth-enabled=false
# 建连令牌：一个共享口令，所有客户端共用；开关打开但此处留空时，建连一律拒绝（失败关闭）
nexus.ws.connect-auth-token=U3RyZWFtTmV4dXM=

# ----------------------------------------------------------------------------------
# 管理页登录：/admin、/console 与 /ws/admin/** 需登录后访问（默认 admin / adminws）
# 与上面两套鉴权无关：那两套管「谁能推」「谁能连」，这套管「谁能打开运维页面」
# ----------------------------------------------------------------------------------
nexus.ws.admin.auth-enabled=true
nexus.ws.admin.username=admin
# 部署务必改掉默认口令：拿到它等于拿到连接台账、强制下线与明文 apiKey
nexus.ws.admin.password=adminws

# 控制台页面拼接 WebSocket 地址时使用（如 ws.example.com:9090）。
# 留空则自动取浏览器当前 hostname + nexus.ws.ws-port，适合本机直连调试
nexus.ws.public-endpoint=

logging.level.com.simonking.nexus.websocket=INFO
logging.level.io.netty=WARN
