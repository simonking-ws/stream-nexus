spring.application.name=nexus-sse
server.port=8088

# 异步请求不过期：SSE 长连接由 HeartbeatTask 依据心跳应答（PONG）自行回收
spring.mvc.async.request-timeout=0

# 页面模板（/admin 管理页为默认页，/console 推送测试页）；关缓存便于改页面即时生效
spring.thymeleaf.cache=false

# 心跳间隔（服务端 -> 客户端 PING），客户端收到后立即回 PONG，同时压制 LB / NAT 空闲断链
nexus.sse.heartbeat-interval=15s
# 心跳超时：超过该时间未收到 PONG 即判定失联并回收（应 >= 3 倍心跳间隔）
nexus.sse.heartbeat-timeout=90s
# 最大存活时间：软重置，客户端会自动重连；0 表示不限制
nexus.sse.max-lifetime=0
# 最大连接数，0 表示不限制
nexus.sse.max-connections=30000

# 推送鉴权：X-Sse-AppId 限定应用，X-Sse-Key 校验密钥，二者必须配对匹配
nexus.sse.auth-enabled=true
# 推送应用（appId / apiKey）不在此配置：内置默认应用 test-demo / c3RyZWFtLW5leHVz（白名单 test），
# 该默认应用只读（不可改、不可删），要别的凭证请在管理页新建
# 其余应用在 /admin 管理页「推送应用」页签运行时增删，并落盘到下面的文件（重启后仍在）
# 相对路径以进程工作目录为基准；多实例部署请各自指向独立文件
nexus.sse.app-store-path=data/push-apps.json

# 建连鉴权：false = 关闭（默认），任何客户端都能直接 /sse/subscribe；
# 开启后必须携带下面这个令牌才能建连（请求头 X-Sse-Token 或查询参数 token 二选一）
nexus.sse.connect-auth-enabled=false
# 建连令牌：一个共享口令，所有客户端共用；开关打开但此处留空时，建连一律拒绝（失败关闭）
nexus.sse.connect-auth-token=57yW56iL5pyd6Iqx5aSV5ou+

# 管理页登录：/admin、/console 与 /sse/admin/** 需登录后访问（默认 admin / adminsse）
# 与上面两套鉴权无关：那两套管「谁能推」「谁能连」，这套管「谁能打开运维页面」
nexus.sse.admin.auth-enabled=true
nexus.sse.admin.username=admin
# 部署务必改掉默认口令：拿到它等于拿到连接台账、强制下线与明文 apiKey
nexus.sse.admin.password=adminsse

logging.level.com.simonking.stream.nexus.sse=INFO
