<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">SSE 推送测试</title>
    <style>
        :root {
            --brand: #2563eb;
            --brand-soft: #eef4ff;
            --border: #e6e8eb;
            --text: #1f2328;
            --muted: #8b949e;
            --danger: #d92d20;
            --ok: #1a7f37;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0 0 40px;
            font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
            color: var(--text);
            background: #f4f6fa;
            font-size: 14px;
        }

        .topbar {
            background: #fff;
            border-bottom: 1px solid var(--border);
            padding: 14px 28px;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }

        .brand { display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 700; }

        .logo {
            width: 26px;
            height: 26px;
            border-radius: 8px;
            background: linear-gradient(135deg, #2563eb, #38bdf8);
            color: #fff;
            font-size: 13px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .nav { display: flex; gap: 6px; }

        .nav a {
            text-decoration: none;
            color: #475467;
            padding: 6px 14px;
            border-radius: 999px;
            font-size: 13px;
            transition: .15s;
        }

        .nav a:hover { background: var(--brand-soft); color: var(--brand); }

        .nav a.active {
            background: var(--brand);
            color: #fff;
            box-shadow: 0 2px 6px rgba(37, 99, 235, .28);
        }

        .meta { color: var(--muted); font-size: 12px; margin-left: auto; }

        .wrap { max-width: 1180px; margin: 0 auto; padding: 22px 28px 0; }

        .card {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 18px 20px;
            margin-bottom: 16px;
            box-shadow: 0 1px 2px rgba(16, 24, 40, .04);
        }

        .card-title { font-size: 15px; font-weight: 600; margin: 0 0 2px; }
        .card-sub { color: var(--muted); font-size: 12px; margin: 0 0 14px; }

        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }

        .field { display: flex; flex-direction: column; gap: 6px; }
        .field label { font-size: 12px; color: #475467; font-weight: 600; }
        .field .hint { font-size: 11px; color: var(--muted); font-weight: 400; }

        input[type=text], select, textarea {
            padding: 7px 10px;
            border: 1px solid #d0d5dd;
            border-radius: 8px;
            font-size: 13px;
            background: #fff;
            outline: none;
            transition: .15s;
            width: 100%;
        }

        input[type=text]:focus, select:focus, textarea:focus {
            border-color: var(--brand);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, .12);
        }

        textarea { font-family: Consolas, "SFMono-Regular", monospace; font-size: 12px; resize: vertical; height: 180px; }

        button {
            width: 100px;
            padding: 7px 14px;
            border-radius: 8px;
            border: 1px solid #d0d5dd;
            background: #fff;
            color: #344054;
            font-size: 13px;
            cursor: pointer;
            transition: .15s;
        }

        button:hover { background: #f4f6fa; }

        button.primary { background: var(--brand); border-color: var(--brand); color: #fff; font-weight: 600; }
        button.primary:hover { background: #1d4ed8; }

        .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

        #status { font-weight: 600; }
        .on { color: var(--ok); }
        .off { color: var(--danger); }

        .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--danger);
            margin-right: 6px;
        }

        .dot.on { background: var(--ok); box-shadow: 0 0 0 3px rgba(26, 127, 55, .15); }

        .cid { font-family: Consolas, monospace; font-size: 12px; word-break: break-all; }

        #log {
            border: 1px solid var(--border);
            border-radius: 10px;
            background: #fff;
            padding: 10px 12px;
            height: 340px;
            overflow: auto;
            font-family: Consolas, "SFMono-Regular", monospace;
            font-size: 12px;
        }

        .line { border-bottom: 1px dashed #eef0f3; padding: 4px 0; }
        .muted { color: var(--muted); }
        .err { color: var(--danger); font-size: 13px; }

        /* 页脚：项目地址，图标随文字颜色走（currentColor），hover 时一起变蓝 */
        .footer {
            max-width: 1180px;
            margin: 4px auto 0;
            padding: 16px 28px 0;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: center;
        }

        .footer a {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            color: var(--muted);
            font-size: 12px;
            transition: .15s;
        }

        .footer a:hover { color: var(--brand); }
        .gh-icon { fill: currentColor; }
    </style>
</head>
<body>

<div class="topbar">
    <div class="brand"><span class="logo">SSE</span> Stream Nexus</div>
    <div class="nav">
        <a th:href="@{/admin}" th:classappend="${active == 'admin'} ? 'active' : ''">连接管理</a>
        <a th:href="@{/console}" th:classappend="${active == 'console'} ? 'active' : ''">推送测试</a>
    </div>
    <div class="meta" th:text="'心跳 ' + ${heartbeatInterval} + 's · 失联判定 ' + ${heartbeatTimeout} + 's'"></div>
</div>

<div class="wrap">
    <div class="card">
        <h3 class="card-title">订阅</h3>
        <p class="card-sub">一条连接可订阅多个模块，模块名须与推送侧 bizModule 完全一致（含大小写）</p>
        <div class="grid">
            <div class="field" style="grid-column:1/-1">
                <label>连接地址 <span class="hint">可编辑，点「连接」时以输入框内容为准（缺 clientId / modules 会自动补齐）</span></label>
                <div style="display:flex;gap:8px;align-items:center">
                    <input type="text" id="subUrl" spellcheck="false">
                    <button onclick="resetUrl()" title="重新生成 clientId 并回填地址">重生成</button>
                </div>
            </div>
            <div class="field">
                <label>订阅业务模块 <span class="hint">逗号分隔，留空默认 *（全局模块）；改动会同步进地址</span></label>
                <input type="text" id="modules" value="test" oninput="syncModules()">
            </div>
            <div class="field">
                <label>连接令牌 <span class="hint" th:text="${connectAuthEnabled} ? '服务端已开启建连鉴权，必填；会以 token 参数拼进地址' : '服务端开启建连鉴权时必填；会以 token 参数拼进地址'"></span></label>
                <input type="text" id="connToken" oninput="syncToken()" th:placeholder="${connectAuthEnabled} ? '必填：缺少令牌将无法建连' : ''">
            </div>
            <!-- 服务端开关下发给 JS：未开启时连令牌都不必带 -->
            <span id="connectAuthEnabled" hidden th:text="${connectAuthEnabled}"></span>
        </div>
        <div class="row" style="margin-top:16px">
            <button class="primary" onclick="connect()">连接</button>
            <button onclick="disconnect()">断开</button>
            <span><span class="dot" id="dot"></span>状态：<span id="status" class="off">未连接</span></span>
            <span class="muted">clientId：<span class="cid" id="clientId">-</span></span>
            <span id="connTip" class="muted"></span>
        </div>
    </div>

    <div class="card">
        <h3 class="card-title">推送</h3>
        <p class="card-sub">POST /sse/push · 需 X-Sse-AppId + X-Sse-Key 配对，且 bizModule 在该应用白名单内</p>
        <div class="grid">
            <div class="field">
                <label>推送应用 <span class="hint">来自 /sse/admin/apps</span></label>
                <select id="appSelect" onchange="onAppChange()"></select>
            </div>
            <div class="field">
                <label>key <span class="hint">选中应用自动带入，可手动覆盖</span></label>
                <input type="text" id="appKey">
            </div>
            <div class="field">
                <label>业务模块</label>
                <input type="text" id="bizModule" value="test">
            </div>
            <div class="field">
                <label>动作</label>
                <input type="text" id="action" value="test_msg">
            </div>
            <div class="field">
                <label>定向 clientId <span class="hint">留空=按模块广播</span></label>
                <input type="text" id="targetClientId" placeholder="留空=按模块广播">
            </div>
        </div>
        <div class="field" style="margin-top:14px">
            <label>推送内容 <span class="hint">自定义业务 JSON，ts 由页面自动填充</span></label>
            <textarea id="payload" rows="4">{
  "message": "hello sse"
}</textarea>
        </div>
        <div class="row" style="margin-top:14px">
            <button class="primary" onclick="push()">推送</button>
            <span class="muted" id="pushTip"></span>
        </div>
    </div>

    <div class="card">
        <h3 class="card-title">收发日志</h3>
        <p class="card-sub">心跳 PING 默认每 15s 一次，收到即回 PONG；不回会被判定失联并回收</p>
        <div id="log"></div>
    </div>
</div>

<footer class="footer">
    <a href="https://github.com/simonking-ws/stream-nexus" target="_blank" rel="noopener noreferrer"
       title="Stream Nexus 项目地址">
        <svg class="gh-icon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
            <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.07-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.42 7.42 0 0 1 2-.27c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.15 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A7.995 7.995 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/>
        </svg>
        <span>github.com/simonking-ws/stream-nexus</span>
    </a>
</footer>

<script>
let es = null;
let clientId = null;
let lastTs = {};      // 按 bizModule:action 记录已处理的最大 ts，用于丢弃乱序消息
let appList = [];     // 推送应用（appId / apiKey），来自 /sse/admin/apps

// 协议常量：与服务端 SseConstants / EventEnum 一一对应，协议值改动需两端同步
const SYS_MODULE = 'sse';   // 系统消息模块，业务路由不匹配即忽略
const EVT_MESSAGE = 'MESSAGE';
const EVT_PING = 'PING';
const EVT_PONG = 'PONG';

// 建连鉴权开启但没带令牌时的统一文案（连接前置校验与 onerror 兜底共用）
const TOKEN_MISSING_TIP = '需要鉴权令牌：服务端已开启建连鉴权，请先填写「连接令牌」再连接';

/** 订阅区提示（与推送区的 tip 分开，避免连接问题显示在推送卡片里） */
function connTip(text, isErr) {
    const el = document.getElementById('connTip');
    el.className = isErr ? 'err' : 'muted';
    el.textContent = text;
}

const bizRoutes = {
    'test:test_msg': m => `消息：${JSON.stringify(m.data)}`,
    'test:bid': m => `出价：${JSON.stringify(m.data)}`,
    'lot:bid': m => `出价：${JSON.stringify(m.data)}`,
    'order:create': m => `订单：${JSON.stringify(m.data)}`
};

function log(text, muted) {
    const div = document.createElement('div');
    div.className = 'line' + (muted ? ' muted' : '');
    div.textContent = `[${new Date().toLocaleTimeString()}] ${text}`;
    document.getElementById('log').prepend(div);
}

/**
 * 连接地址：默认拼自当前站点，可手改（如换端口 / 走网关域名）。
 * 手改后非法时回退到默认地址，避免静默连不上
 */
function currentUrl() {
    try {
        return new URL(document.getElementById('subUrl').value.trim());
    } catch (e) {
        return new URL(location.origin + '/sse/subscribe');
    }
}

/**
 * 生成新 clientId 并回填地址：页面加载、断开、点「重生成」都会走这里
 */
function resetUrl() {
    clientId = (crypto.randomUUID && crypto.randomUUID()) || String(Date.now());
    document.getElementById('clientId').textContent = clientId;
    const u = currentUrl();
    u.searchParams.set('clientId', clientId);
    if (!u.searchParams.get('modules')) {
        u.searchParams.set('modules', document.getElementById('modules').value);
    }
    document.getElementById('subUrl').value = u.toString();
}

/** 订阅模块改动同步进地址（只改 modules 参数，保留手改的其余部分） */
function syncModules() {
    const u = currentUrl();
    u.searchParams.set('modules', document.getElementById('modules').value);
    document.getElementById('subUrl').value = u.toString();
}

/** 令牌改动同步进地址：留空则移除该参数（服务端未开启建连鉴权时不带） */
function syncToken() {
    const u = currentUrl();
    const tk = document.getElementById('connToken').value.trim();
    if (tk) {
        u.searchParams.set('token', tk);
        connTip('');   // 填上了就把「需要令牌」的提示撤掉
    } else {
        u.searchParams.delete('token');
    }
    document.getElementById('subUrl').value = u.toString();
}

/** 服务端是否开启建连鉴权（由 PageController 下发） */
function connectAuthEnabled() {
    return document.getElementById('connectAuthEnabled').textContent.trim() === 'true';
}

/** 地址 / 输入框里的连接令牌，取当前实际会发出去的那个 */
function currentToken() {
    return (currentUrl().searchParams.get('token') || '').trim();
}

function connect() {
    if (es) return;
    // 开了建连鉴权却没带令牌：先拦住。否则 EventSource 只会拿到 401，
    // 而 onerror 拿不到状态码，页面表现为「一直重连中」，看不出是没有令牌
    if (connectAuthEnabled() && !currentToken()) {
        connTip(TOKEN_MISSING_TIP, true);
        log('连接失败：' + TOKEN_MISSING_TIP);
        document.getElementById('connToken').focus();
        return;
    }
    connTip('');
    // 地址里没有 clientId（被手改删掉）时补一个，否则沿用地址里的那个
    if (!currentUrl().searchParams.get('clientId')) {
        resetUrl();
    } else {
        clientId = currentUrl().searchParams.get('clientId');
        document.getElementById('clientId').textContent = clientId;
    }
    setStatus('已连接', true);

    es = new EventSource(currentUrl().toString());

    es.onopen = () => {
        setStatus('已连接', true);
        connTip('');
        log('连接建立，请在真实业务中重新拉取全量状态');
    };

    es.onerror = () => {
        // 鉴权失败（令牌缺失 / 错误）服务端回 401，浏览器会自动重连且 onerror 拿不到状态码：
        // 这里主动断开并提示原因，避免页面一直「重连中」却无人知道是令牌的问题
        if (connectAuthEnabled()) {
            es.close();
            es = null;
            setStatus('未授权', false);
            if (!currentToken()) {
                connTip(TOKEN_MISSING_TIP, true);
                log('连接被拒（401）：' + TOKEN_MISSING_TIP);
                document.getElementById('connToken').focus();
            } else {
                connTip('连接被拒（401）：令牌不正确，请核对后重连', true);
                log('连接被拒（401）：令牌不正确，请核对后重连');
            }
            return;
        }
        setStatus('重连中', false);
    };

    // 业务消息（建连消息 sse/connected 也走这里）
    es.addEventListener(EVT_MESSAGE, e => {
        const m = JSON.parse(e.data);
        if (m.bizModule === SYS_MODULE) {
            log('收到建连消息：' + JSON.stringify(m.data), true);
            return;
        }
        const key = `${m.bizModule}:${m.action}`;
        if (m.ts <= (lastTs[key] || 0)) return;   // 丢弃乱序 / 旧消息
        lastTs[key] = m.ts;
        const render = bizRoutes[key];
        log(`${key} ${render ? render(m) : JSON.stringify(m.data)}`);
    });

    // 心跳：服务端每 15s 下发一次 PING，收到立即回 PONG；
    // 不回会被判定失联（默认 90s）并回收连接
    es.addEventListener(EVT_PING, () => pong());
}

function setStatus(text, online) {
    document.getElementById('status').textContent = text;
    document.getElementById('status').className = online ? 'on' : 'off';
    document.getElementById('dot').className = 'dot' + (online ? ' on' : '');
}

function pong() {
    fetch(`/sse/pong?clientId=${encodeURIComponent(clientId)}`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({event: EVT_PONG, ts: Date.now()})
    });
}

function disconnect() {
    if (!es) return;
    es.close();
    es = null;
    setStatus('已断开', false);
    resetUrl();   // 换一个 clientId，下次连接是全新身份
}

function tip(text, isErr) {
    const el = document.getElementById('pushTip');
    el.className = isErr ? 'err' : 'muted';
    el.textContent = text;
}

/**
 * 拉取推送应用，填充 appId 下拉；优先选中内置默认应用
 */
async function loadApps() {
    const sel = document.getElementById('appSelect');
    let defaultAppId = '';
    try {
        const resp = await fetch('/sse/admin/apps');
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        const data = await resp.json();
        appList = data.items || [];
        defaultAppId = data.defaultAppId || '';
        tip('');
    } catch (e) {
        appList = [];
        tip('应用列表拉取失败：' + e.message, true);
    }
    sel.innerHTML = '';
    if (appList.length === 0) {
        const opt = document.createElement('option');
        opt.textContent = '（无应用，请到管理页新增）';
        sel.appendChild(opt);
    } else {
        appList.forEach(app => {
            const opt = document.createElement('option');
            opt.value = app.appId;
            opt.textContent = app.appId + '（' + (app.allowedModules || []).join(',') + '）';
            sel.appendChild(opt);
        });
        sel.value = appList.some(a => a.appId === defaultAppId) ? defaultAppId : appList[0].appId;
    }
    onAppChange();
}

function onAppChange() {
    const app = appList.find(a => a.appId === document.getElementById('appSelect').value);
    // 下拉选中即带入 key；保留输入框可手动覆盖，用于临时验证「错误 key 应被拒」
    document.getElementById('appKey').value = app ? app.apiKey : '';
}

function push() {
    const appId = document.getElementById('appSelect').value;
    const apiKey = document.getElementById('appKey').value.trim();
    if (!appId || !apiKey) {
        tip('请选择推送应用或手填 key', true);
        return;
    }

    let data;
    try {
        data = JSON.parse(document.getElementById('payload').value || '{}');
    } catch (e) {
        tip('推送内容不是合法 JSON：' + e.message, true);
        return;
    }
    // ts 由页面统一填充：它是客户端丢弃乱序 / 旧消息的依据
    data.ts = Date.now();

    const body = {
        bizModule: document.getElementById('bizModule').value.trim(),
        action: document.getElementById('action').value.trim(),
        data: data
    };
    const targetClientId = document.getElementById('targetClientId').value.trim();
    if (targetClientId) {
        body.clientIds = [targetClientId];   // 定向推送（与按模块广播取并集）
    }
    tip('');
    fetch('/sse/push', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-Sse-AppId': appId,
            'X-Sse-Key': apiKey
        },
        body: JSON.stringify(body)
    }).then(r => r.json()).then(r => log('推送结果：' + JSON.stringify(r), true));
}

// 初始地址：当前站点 + /sse/subscribe，并带上一个现成的 clientId
document.getElementById('subUrl').value =
    location.origin + '/sse/subscribe?modules=' + encodeURIComponent(document.getElementById('modules').value);
resetUrl();
loadApps();
</script>
</body>
</html>
