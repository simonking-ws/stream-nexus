<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">登录 · Stream Nexus</title>
    <meta name="color-scheme" content="dark">
    <link rel="stylesheet" th:href="@{/css/nexus-tech.css}">
    <style>
        /* 登录页私有补充：公共科技感主题（深色 / 霓虹 / 动效）见 /css/nexus-tech.css */

        /* 遮罩：把背景的粒子 / 网格 / 光晕整体压暗，登录框才从背景里「浮」出来。
           z-index 与 .topbar 同级，靠 DOM 顺序（遮罩写在最前）保证顶栏仍在遮罩之上 */
        .login-veil {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            background:
                    radial-gradient(ellipse at 50% 40%,
                            rgba(8, 13, 30, .62) 0%,
                            rgba(4, 6, 14, .84) 55%,
                            rgba(2, 3, 8, .95) 100%);
            backdrop-filter: blur(3px) saturate(.85);
            -webkit-backdrop-filter: blur(3px) saturate(.85);
        }

        .login-wrap { max-width: 400px; padding-top: 9vh; position: relative; z-index: 2; }

        /* 登录框：主题 .card 的玻璃底是 .72 不透明度，背景粒子会透上来，
           在本页等于把输入框和背景糊在一起——这里换成近乎实色 + 霓虹描边 + 外发光 */
        .login-card {
            padding: 28px 28px 24px;
            border: 1px solid rgba(94, 210, 255, .5);
            border-radius: 18px;
            background: linear-gradient(180deg, rgba(20, 29, 54, .97), rgba(10, 16, 32, .97));
            box-shadow:
                    0 0 0 1px rgba(34, 211, 238, .1),
                    0 26px 60px -20px rgba(0, 0, 0, .95),
                    0 0 48px -8px rgba(34, 211, 238, .38);
        }

        /* 顶边霓虹线加粗提亮：整页唯一焦点，这根线就是视觉锚点 */
        .login-card::before { height: 2px; opacity: 1; }

        .login-card .card-title { font-size: 20px; }
        .login-card .card-sub { margin-bottom: 20px; }
        .login-card form { display: flex; flex-direction: column; gap: 14px; }
        .login-card input { width: 100%; }

        /* 输入框：底色再压深一档、描边提亮，与卡片底拉开层次 */
        .login-card input[type=text],
        input[type=password] {
            background: rgba(5, 9, 20, .9);
            border-color: rgba(148, 163, 184, .3);
        }

        /* 主题里只写了 text / select / textarea，密码框单独对齐成同一套观感 */
        input[type=password] {
            padding: 8px 11px;
            border: 1px solid rgba(148, 163, 184, .22);
            border-radius: 9px;
            font-size: 13px;
            background: rgba(8, 13, 26, .72);
            color: var(--text);
            outline: none;
            transition: .18s;
        }
        input[type=password]:focus {
            border-color: var(--brand);
            background: rgba(8, 13, 26, .95);
            box-shadow: 0 0 0 3px rgba(34, 211, 238, .18);
        }
        .login-card button { width: 100%; padding: 9px 15px; margin-top: 4px; }
        .login-err {
            margin: 0;
            padding: 7px 10px;
            border-radius: 9px;
            border: 1px solid rgba(251, 113, 133, .35);
            background: rgba(251, 113, 133, .1);
            color: #fda4af;
            font-size: 12px;
        }
        .login-tip { margin: 14px 0 0; font-size: 11px; }
    </style>
</head>
<body>

<!-- 压暗背景的遮罩：必须在 .topbar 之前（同 z-index 下靠 DOM 顺序决定谁在上面） -->
<div class="login-veil"></div>

<div class="topbar">
    <div class="brand"><span class="logo">SSE</span> <span class="brand-text">Stream Nexus</span></div>
    <div class="nav"></div>
    <div class="meta">
        <span class="live"><i></i>SECURE</span>
    </div>
</div>

<div class="wrap login-wrap">
    <div class="card login-card">
        <h3 class="card-title">登录</h3>
        <p class="card-sub">管理页与运维接口需要登录后访问</p>

        <!-- 回跳地址：登录后回到原来要去的页面（服务端已限制为站内路径） -->
        <form method="post" th:action="@{/login}">
            <input type="hidden" name="redirect" th:value="${redirect}">
            <div class="field">
                <label for="username">账号</label>
                <input type="text" id="username" name="username" autocomplete="username" autofocus>
            </div>
            <div class="field">
                <label for="password">密码</label>
                <input type="password" id="password" name="password" autocomplete="current-password">
            </div>
            <p class="login-err" th:if="${error}">账号或密码不正确</p>
            <button class="primary" type="submit">登录</button>
        </form>

        <p class="muted login-tip">账号 / 口令由 nexus.sse.admin.username、nexus.sse.admin.password 配置。</p>
    </div>
</div>

<footer class="footer">
    <a href="https://github.com/simonking-ws/stream-nexus" target="_blank" rel="noopener noreferrer"
       title="Stream Nexus 项目地址">
        <svg class="gh-icon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
            <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.07-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.42 7.42 0 0 1 2-.27c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.15 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A7.995 7.995 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/>
        </svg>
        <span>github.com/simonking-ws/stream-nexus</span>
    </a>
</footer>

<script th:src="@{/js/nexus-tech.js}"></script>
</body>
</html>
